name: PR Lint Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  checks: write
  contents: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/node-tests.yml
    with:
      eslint-command: npm run lint:ci
      prettier-command: npm run prettier:ci
    secrets: inherit
  dist-check:
    uses: ./.github/workflows/dist-check.yml
    secrets: inherit
  dist-run:
    if: ${{ github.event_name != 'push' }}
    needs: [test,dist-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./
  success:
    needs: [test,dist-check]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Workflow successful"