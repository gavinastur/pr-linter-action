name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Perform a dry run of the release thus not creating releases/tags"
        type: choice
        default: "false"
        options:
          - "true"
          - "false"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      new_release_notes: ${{ steps.release.outputs.new_release_notes }}
      new_release_major_version: ${{ steps.release.outputs.new_release_major_version }}
      new_release_minor_version: ${{ steps.release.outputs.new_release_minor_version }}
      new_release_patch_version: ${{ steps.release.outputs.new_release_patch_version }}
      last_release_version: ${{ steps.release.outputs.last_release_version }}
    steps:
      # The release commit (with dist/) is pushed to main, which the ruleset only allows for
      # bypass actors. The GitHub App is on the bypass list; GITHUB_TOKEN cannot be.
      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The checkout credentials are used for git pushes, so they must be the App token too.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Commit as the App's bot user rather than @semantic-release/git's default author.
      # The noreply email needs the bot's user ID, which links the commit to the App on GitHub.
      - name: Get release bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # The action runs from dist/, which is built here and committed in the release commit
      # by @semantic-release/git, so pull requests (including Renovate) never rebuild it.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build dist
        run: |
          npm ci --quiet
          npm run build

      # A broken bundle fails here, before anything is committed or tagged.
      # Run the bundle on Node 24, the same runtime GitHub uses for `runs.using: node24`
      - name: Set up action runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Smoke test dist
        run: npm run test:dist

      - id: release
        name: Run semantic-release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          dry_run: ${{ inputs.dry-run }}
          extra_plugins: |
            conventional-changelog-conventionalcommits@8.0.0
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}

      - name: Success summary
        if: ${{ steps.release.outputs.new_release_published == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
          RELEASE_NOTES: ${{ steps.release.outputs.new_release_notes }}
        run: |
          {
            printf '### :bookmark: ✅ New release created (%s)\n' "$RELEASE_VERSION"
            printf '**Release Notes:**\n'
            printf '%s\n' "$RELEASE_NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

  update-major-tag:
    name: Update Major Tag
    needs: release
    if: ${{ needs.release.outputs.new_release_published == 'true' && inputs.dry-run != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Move major tag
        env:
          TAG_NAME: v${{ needs.release.outputs.new_release_version }}
          MAJOR_TAG: v${{ needs.release.outputs.new_release_major_version }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          git fetch --tags --force
          git tag -fa "$MAJOR_TAG" "$TAG_NAME" -m "chore(release): move $MAJOR_TAG to $TAG_NAME"
          git push origin "refs/tags/$MAJOR_TAG" --force
