name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Perform a dry run of the release thus not creating releases/tags"
        type: choice
        default: "false"
        options:
          - "true"
          - "false"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      new_release_notes: ${{ steps.release.outputs.new_release_notes }}
      new_release_major_version: ${{ steps.release.outputs.new_release_major_version }}
      new_release_minor_version: ${{ steps.release.outputs.new_release_minor_version }}
      new_release_patch_version: ${{ steps.release.outputs.new_release_patch_version }}
      last_release_version: ${{ steps.release.outputs.last_release_version }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          dry_run: ${{ inputs.dry-run }}
          extra_plugins: |
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Success summary
        if: ${{ steps.release.outputs.new_release_published == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
          RELEASE_NOTES: ${{ steps.release.outputs.new_release_notes }}
        run: |
          {
            printf '### :bookmark: ✅ New release created (%s)\n' "$RELEASE_VERSION"
            printf '**Release Notes:**\n'
            printf '%s\n' "$RELEASE_NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

  update-major-tag:
    name: Update Major Tag
    needs: release
    if: ${{ needs.release.outputs.new_release_published == 'true' && inputs.dry-run != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Move major tag
        env:
          TAG_NAME: v${{ needs.release.outputs.new_release_version }}
          MAJOR_TAG: v${{ needs.release.outputs.new_release_major_version }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          git fetch --tags --force
          git tag -fa "$MAJOR_TAG" "$TAG_NAME" -m "chore(release): move $MAJOR_TAG to $TAG_NAME"
          git push origin "refs/tags/$MAJOR_TAG" --force
