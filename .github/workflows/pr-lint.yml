name: PR lint

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  prlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # dist/ is only committed at release time, so build it to test this branch's code
      - name: Build dist
        run: |
          npm ci --quiet
          npm run build
      - uses: ./
