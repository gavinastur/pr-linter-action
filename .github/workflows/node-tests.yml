name: Node Tests

permissions:
  actions: read
  checks: write
  contents: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      install-command:
        required: false
        type: string
        description: "Used to override the default command to install your dependencies e.g. npm install"
        default: "npm ci --quiet"
      path:
        required: false
        type: string
        description: "Relative path from project root to your node application's source files"
        default: "."
      lint-enable:
        required: false
        type: boolean
        description: "To disable the lint job set to false"
        default: true
      lint-command:
        required: false
        type: string
        description: "Use to execute a standard ES Lint command (e.g. npm lint:ci)"
        default: "npm run lint:ci"
      test-enable:
        required: false
        type: boolean
        description: "To disable the unit-tests job set to false"
        default: true
      test-command:
        required: false
        type: string
        description: "Used to override the default command to run your unit tests"
        default: "npm run test:ci"
      coverage-report-enable:
        required: false
        type: boolean
        description: "To enable PR coverage report set to true. Requires that the test-command generates a 'coverage/clover.xml' file."
        default: true
      coverage-only-list-changed-files:
        type: boolean
        description: "For the PR coverage report, only list changed files."
        required: false
        default: false
      coverage-fail-threshold:
        required: false
        type: number
        description: "For the PR coverage report, fail if overall coverage is below this percentage."
        default: 80
      tsc-enable:
        required: false
        type: boolean
        description: "To disable the tsc job set to false"
        default: true
      tsc-flags:
        required: false
        type: string
        description: "Provide additional flags to the tsc command"
      tsc-fail-on-error:
        required: false
        type: boolean
        description: "To not fail the job on tsc errors set to false"
        default: true
      artifact-prefix:
        type: string
        description: "A prefix to apply to the name of the artifacts to upload (useful for matrix builds)"
        required: false
      fetch-depth:
        required: false
        type: number
        description: "Number of commits to fetch. 0 indicates all history for all branches and tags."
        default: 1
    secrets:
      auth-token:
        required: false
        description: "Arbitrary token to be exposed as environment variable in the format VARIABLE=value"
      auth-token-2:
        required: false
        description: "Arbitrary token to be exposed as environment variable in the format VARIABLE=value"
    outputs:
      ref-slug:
        description: "A URL sanitized version of the github ref"
        value: ${{ jobs.lint.outputs.ref-slug }}
      short-sha:
        description: "Captures the short SHA for use in this or later workflow jobs"
        value: ${{ jobs.lint.outputs.short-sha }}
jobs:
  lint:
    name: Lint
    if: ${{ inputs.lint-enable }}
    runs-on: ubuntu-26.04
    outputs:
      short-sha: ${{ env.GITHUB_SHA_SHORT }}
      ref-slug: ${{ env.GITHUB_REF_SLUG_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Slugify GitHub variables
        uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Each secret is a VARIABLE=value line. GitHub masks the whole secret string, so the value
      # is masked separately before it becomes an environment variable for later steps.
      - name: Export auth tokens
        env:
          AUTH_TOKEN_1: ${{ secrets.auth-token }}
          AUTH_TOKEN_2: ${{ secrets.auth-token-2 }}
        run: |
          for token in "$AUTH_TOKEN_1" "$AUTH_TOKEN_2"; do
            if [ -n "$token" ]; then
              echo "::add-mask::${token#*=}"
              echo "$token" >> "$GITHUB_ENV"
            fi
          done

      - name: Install dependencies
        working-directory: ${{ inputs.path }}
        run: |
          ${{ inputs.install-command }}

      - name: Run lint
        working-directory: ${{ inputs.path }}
        if: ${{ inputs.lint-command }}
        run: |
          ${{ inputs.lint-command }}
  tests:
    name: Tests
    runs-on: ubuntu-26.04
    if: ${{ inputs.test-enable }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Each secret is a VARIABLE=value line. GitHub masks the whole secret string, so the value
      # is masked separately before it becomes an environment variable for later steps.
      - name: Export auth tokens
        env:
          AUTH_TOKEN_1: ${{ secrets.auth-token }}
          AUTH_TOKEN_2: ${{ secrets.auth-token-2 }}
        run: |
          for token in "$AUTH_TOKEN_1" "$AUTH_TOKEN_2"; do
            if [ -n "$token" ]; then
              echo "::add-mask::${token#*=}"
              echo "$token" >> "$GITHUB_ENV"
            fi
          done

      - name: Install dependencies
        working-directory: ${{ inputs.path }}
        run: |
          ${{ inputs.install-command }}

      - name: Run tests
        working-directory: ${{ inputs.path }}
        run: |
          ${{ inputs.test-command }}

      - name: Generate coverage report
        uses: clearlyip/code-coverage-report-action@9e2cd22e39153feba8b4477e4fefcc0b5e2727ba # v6.0.1
        id: code_coverage_report_action
        if: inputs.coverage-report-enable && github.actor != 'renovate[bot]'
        with:
          filename: ${{ inputs.path }}/coverage/clover.xml
          artifact_download_workflow_names: ${{ github.workflow }}
          only_list_changed_files: ${{ inputs.coverage-only-list-changed-files }}
          overall_coverage_fail_threshold: ${{ inputs.coverage-fail-threshold }}

      - name: Add coverage PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: inputs.coverage-report-enable && steps.code_coverage_report_action.outputs.file != '' &&
          github.event_name == 'pull_request' && (success() || failure())
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Upload unit test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: "${{ inputs.artifact-prefix }}Unit Test & Coverage Reports"
          path: |
            ${{ inputs.path }}/junit.xml
            ${{ inputs.path }}/test-report.html
            ${{ inputs.path }}/coverage/test-report.html
            ${{ inputs.path }}/coverage/clover.xml
  tsc:
    name: TSC
    if: ${{ inputs.tsc-enable }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Slugify GitHub variables
        uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Each secret is a VARIABLE=value line. GitHub masks the whole secret string, so the value
      # is masked separately before it becomes an environment variable for later steps.
      - name: Export auth tokens
        env:
          AUTH_TOKEN_1: ${{ secrets.auth-token }}
          AUTH_TOKEN_2: ${{ secrets.auth-token-2 }}
        run: |
          for token in "$AUTH_TOKEN_1" "$AUTH_TOKEN_2"; do
            if [ -n "$token" ]; then
              echo "::add-mask::${token#*=}"
              echo "$token" >> "$GITHUB_ENV"
            fi
          done

      - name: Install dependencies
        working-directory: ${{ inputs.path }}
        run: |
          ${{ inputs.install-command }}

      - name: Run TSC
        working-directory: ${{ inputs.path }}
        continue-on-error: ${{ !inputs.tsc-fail-on-error }}
        env:
          TSC_FLAGS: ${{ inputs.tsc-flags }}
        run: npx tsc --noEmit --pretty false $TSC_FLAGS
