name: PR Linter Action
description: A GitHub action that enforces conventional commit spec on pull request titles to ensure a clean commit history.
author: Navigation
runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: 24
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --quiet --omit=dev
    - name: Run PR linter
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run start
branding:
  icon: git-pull-request
  color: blue

