name: PR Linter Action
description: A GitHub action that enforces conventional commit spec on pull request titles to ensure a clean commit history.
author: Navigation
runs:
  using: composite
  steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.16.0
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --quiet --omit=dev
    - name: Run PR linter
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run start
branding:
  icon: git-pull-request
  color: blue

