name: PR Linter Action
description: A GitHub action that enforces conventional commit spec on pull request titles to ensure a clean commit history.
author: Navigation
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.18.1
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --quiet --omit=dev
    - name: Run PR linter
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run start
branding:
  icon: git-pull-request
  color: blue

