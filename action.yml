name: PR Linter Action
description: A GitHub action that enforces conventional commit spec on pull request titles to ensure a clean commit history.
author: Navigation
runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24.18.0
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --quiet --omit=dev
    - name: Run PR linter
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run start
branding:
  icon: git-pull-request
  color: blue

